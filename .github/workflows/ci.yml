name: 持续集成与发布

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fasttab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_PACKAGES: >-
    build-essential
    curl
    tar
    xz-utils
    file
    git
    wget
    patchelf
    binutils
    desktop-file-utils
    librsvg2-bin
    zsync
    zstd
    rpm
    dpkg-dev
    strace
    dbus-x11
    libfuse2t64
    libasound2-dev
    libgl1-mesa-dev
    libglu1-mesa-dev
    libwayland-dev
    libx11-dev
    libx11-xcb-dev
    libxcb-composite0-dev
    libxcb-damage0-dev
    libxcb-image0-dev
    libxcb-keysyms1-dev
    libxcb-shm0-dev
    libxcb-util0-dev
    libxcb1-dev
    libxcursor-dev
    libxi-dev
    libxinerama-dev
    libxkbcommon-dev
    libxrandr-dev

jobs:
  test:
    name: 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 核对源码与元数据
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python -m py_compile .github/scripts/*.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('packaging/fasttab.svg')"
          bash -n setup.sh build_appimage.sh build_packages.sh
          test -s LICENSE.md
          test ! -e tools/generate_gpu_preview_sources.py
          test ! -e tools/fix_generated_gpu_source.py
          grep -Fq "X-AppImage-Version=$VERSION" packaging/fasttab.desktop
          grep -Fq 'self.releaseAllBindings();' src/app.zig
          grep -Fq 'if (self.window_hidden) return;' src/app.zig
          grep -Fq 'tex.reacquire(self.conn)' src/app.zig
          grep -Fq 'fn cacheSnapshotForWindow' src/app.zig
          grep -Fq 'finalColor = vec4(averaged.rgb * fragColor.rgb, fragColor.a);' src/shaders/downsample.fs
          ! grep -Fq 'microsoft-edge' src/app.zig src/x11.zig build.zig
          ! grep -Fq 'remmina' src/app.zig src/x11.zig build.zig
          ! grep -Fq 'uploadWindowFromRoot' src/app.zig src/x11.zig build.zig
          grep -Fq 'FastTab 是一款面向 X11 的高性能窗口切换器' README.md
          grep -Fq 'License:        GPL-3.0-only' build_packages.sh
          grep -Fq '/usr/share/doc/fasttab/LICENSE.md' build_packages.sh

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: 配置 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: 核对桌面文件元数据
        run: desktop-file-validate packaging/fasttab.desktop

      - name: 下载并构建依赖
        run: ./setup.sh

      - name: 运行测试
        run: zig build test

      - name: 构建 ReleaseSafe 二进制文件
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: 核对命令行输出流
        run: |
          test -x zig-out/bin/fasttab
          zig-out/bin/fasttab --help >help.out 2>help.err
          grep -Fq 'Fast GPU-accelerated X11 window switcher.' help.out
          ! grep -Fq 'version' help.out
          test ! -s help.err
          set +e
          zig-out/bin/fasttab --version >version.out 2>version.err
          version_status=$?
          set -e
          test "$version_status" -eq 2
          test ! -s version.out
          grep -Fq 'Error: unknown argument: --version' version.err
          set +e
          zig-out/bin/fasttab --invalid >invalid.out 2>invalid.err
          status=$?
          set -e
          test "$status" -eq 2
          test ! -s invalid.out
          grep -Fq 'Error: unknown argument: --invalid' invalid.err

  appimage:
    name: 构建 AppImage
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: 配置 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: 安装 quick-sharun
        run: |
          sudo curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh \
            --output /usr/local/bin/quick-sharun
          sudo chmod +x /usr/local/bin/quick-sharun

      - name: 构建 AppImage
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          bash ./build_packages.sh --appimage-only
          SOURCE="dist/FastTab-${VERSION}-x86_64.AppImage"
          test -s "$SOURCE"
          cp "$SOURCE" dist/fasttab.AppImage
          test -s dist/fasttab.AppImage

      - name: 上传发布文件
        uses: actions/upload-artifact@v4
        with:
          name: fasttab-release
          path: dist/fasttab.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Latest
    needs: [test, appimage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载发布文件
        uses: actions/download-artifact@v4
        with:
          name: fasttab-release
          path: dist

      - name: 更新 Latest 标签
        run: |
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "FastTab" \
              --notes "" \
              --latest
          else
            gh release create latest \
              --title "FastTab" \
              --notes "" \
              --latest
          fi

          gh release upload latest dist/fasttab.AppImage --clobber

      - name: 删除其他 Release 文件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id')"

          mapfile -t asset_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
              --jq '.[] | select(.name != "fasttab.AppImage") | .id'
          )

          for asset_id in "${asset_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done

      - name: 删除旧的 Release 和版本标签
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t release_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.tag_name != "latest") | .id'
          )

          for release_id in "${release_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done

          mapfile -t old_tags < <(
            git ls-remote --tags --refs origin |
              awk '{sub(/^refs\/tags\//, "", $2); print $2}' |
              grep -vx 'latest' || true
          )

          for tag in "${old_tags[@]}"; do
            git push origin ":refs/tags/${tag}"
          done

      - name: 核对最终 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" > release.json

          python - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          assert release["tag_name"] == "latest"
          assert release["name"] == "FastTab"
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert not (release.get("body") or "").strip()

          assets = {asset["name"]: asset for asset in release["assets"]}
          assert set(assets) == {"fasttab.AppImage"}
          assert assets["fasttab.AppImage"]["size"] > 0
          PY

      - name: 删除已移除工作流的历史运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t run_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&status=completed" \
              --jq '.workflow_runs[] | select(.path != ".github/workflows/ci.yml") | .id'
          )

          for run_id in "${run_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done
