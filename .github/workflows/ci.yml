name: 持续集成与发布

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fasttab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_PACKAGES: >-
    build-essential
    curl
    tar
    xz-utils
    file
    git
    wget
    patchelf
    binutils
    desktop-file-utils
    librsvg2-bin
    zsync
    zstd
    rpm
    dpkg-dev
    strace
    dbus-x11
    libfuse2t64
    libasound2-dev
    libgl1-mesa-dev
    libglu1-mesa-dev
    libwayland-dev
    libx11-dev
    libx11-xcb-dev
    libxcb-composite0-dev
    libxcb-damage0-dev
    libxcb-image0-dev
    libxcb-keysyms1-dev
    libxcb-shm0-dev
    libxcb-util0-dev
    libxcb1-dev
    libxcursor-dev
    libxi-dev
    libxinerama-dev
    libxkbcommon-dev
    libxrandr-dev

jobs:
  test:
    name: 测试
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 核对源码与元数据
        run: |
          set -euxo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" == "2.0.7" ]]
          python -m py_compile .github/scripts/*.py
          python -c "import xml.etree.ElementTree as ET; ET.parse('packaging/fasttab.svg')"
          bash -n setup.sh build_appimage.sh build_packages.sh
          test -s LICENSE.md
          test ! -e tools/generate_gpu_preview_sources.py
          test ! -e tools/fix_generated_gpu_source.py
          grep -Fq "X-AppImage-Version=$VERSION" packaging/fasttab.desktop
          grep -Fq "const FASTTAB_VERSION = \"$VERSION\";" src/main.zig
          grep -Fq 'self.releaseAllBindings();' src/app.zig
          grep -Fq 'if (self.window_hidden) return;' src/app.zig
          grep -Fq 'tex.reacquire(self.conn)' src/app.zig
          grep -Fq 'fn cacheSnapshotForWindow' src/app.zig
          grep -Fq 'finalColor = vec4(averaged.rgb * fragColor.rgb, fragColor.a);' src/shaders/downsample.fs
          ! grep -Fq 'microsoft-edge' src/app.zig src/x11.zig build.zig
          ! grep -Fq 'remmina' src/app.zig src/x11.zig build.zig
          ! grep -Fq 'uploadWindowFromRoot' src/app.zig src/x11.zig build.zig
          grep -Fq 'FastTab 是一款面向 X11 的高性能窗口切换器' README.md
          grep -Fq 'License:        GPL-3.0-only' build_packages.sh
          grep -Fq '/usr/share/doc/fasttab/LICENSE.md' build_packages.sh

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: 配置 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: 核对桌面文件元数据
        run: desktop-file-validate packaging/fasttab.desktop

      - name: 下载并构建依赖
        run: ./setup.sh

      - name: 运行测试
        run: zig build test

      - name: 构建 ReleaseSafe 二进制文件
        run: zig build -Doptimize=ReleaseSafe -Dcpu=baseline

      - name: 核对命令行输出流
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -x zig-out/bin/fasttab
          zig-out/bin/fasttab --help >help.out 2>help.err
          grep -Fq "FastTab $VERSION" help.out
          test ! -s help.err
          zig-out/bin/fasttab --version >version.out 2>version.err
          grep -Fxq "FastTab $VERSION" version.out
          test ! -s version.err
          set +e
          zig-out/bin/fasttab --invalid >invalid.out 2>invalid.err
          status=$?
          set -e
          test "$status" -eq 2
          test ! -s invalid.out
          grep -Fq 'Error: unknown argument: --invalid' invalid.err

  packages:
    name: 构建安装包
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            appimage_arch: x86_64
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            appimage_arch: aarch64
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES

      - name: 配置 Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: 安装 quick-sharun
        run: |
          sudo curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/refs/heads/main/useful-tools/quick-sharun.sh \
            --output /usr/local/bin/quick-sharun
          sudo chmod +x /usr/local/bin/quick-sharun

      - name: 构建 DEB
        run: |
          FASTTAB_SKIP_RPM=1 bash ./build_packages.sh --native-only
          mkdir -p deb-dist
          cp -a dist/. deb-dist/

      - name: 构建 RPM
        run: |
          FASTTAB_SKIP_DEB=1 bash ./build_packages.sh --native-only
          mkdir -p rpm-dist
          cp -a dist/. rpm-dist/

      - name: 构建 AppImage
        run: |
          bash ./build_packages.sh --appimage-only
          cp -a deb-dist/. dist/
          cp -a rpm-dist/. dist/

      - name: 核对发布文件
        env:
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          APPIMAGE="dist/FastTab-${VERSION}-${APPIMAGE_ARCH}.AppImage"
          DEB="dist/fasttab_${VERSION}_${DEB_ARCH}.deb"
          RPM="dist/fasttab-${VERSION}-1.${RPM_ARCH}.rpm"

          test -s "$APPIMAGE"
          test -s "$APPIMAGE.zsync"
          test -s "$APPIMAGE.sha256"
          test -s "$DEB"
          test -s "$DEB.sha256"
          test -s "$RPM"
          test -s "$RPM.sha256"

          for size in 16 32 64 128 256; do
            test -s "AppDir/usr/share/icons/hicolor/${size}x${size}/apps/fasttab.png"
          done
          test -s AppDir/usr/share/icons/hicolor/scalable/apps/fasttab.svg
          test -s AppDir/usr/share/pixmaps/fasttab.png
          test -s AppDir/usr/share/doc/fasttab/LICENSE.md

          dpkg-deb --field "$DEB" Package Version Architecture
          rpm -qp "$RPM"
          rpm -qp --qf '%{LICENSE}\n' "$RPM" | grep -Fxq 'GPL-3.0-only'

          (
            cd dist
            sha256sum -c "$(basename "$APPIMAGE.sha256")"
            sha256sum -c "$(basename "$DEB.sha256")"
            sha256sum -c "$(basename "$RPM.sha256")"
          )

      - name: 上传发布文件
        uses: actions/upload-artifact@v4
        with:
          name: fasttab-${{ matrix.appimage_arch }}-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布并清理历史记录
    needs: [test, packages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: write
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析发布版本
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载发布文件
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: fasttab-*-release-files
          path: dist
          merge-multiple: true

      - name: 核对完整发布文件集
        if: steps.version.outputs.publish == 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          for arch in x86_64 aarch64; do
            test -s "dist/FastTab-${VERSION}-${arch}.AppImage"
            test -s "dist/FastTab-${VERSION}-${arch}.AppImage.zsync"
            test -s "dist/FastTab-${VERSION}-${arch}.AppImage.sha256"
          done
          for arch in amd64 arm64; do
            test -s "dist/fasttab_${VERSION}_${arch}.deb"
            test -s "dist/fasttab_${VERSION}_${arch}.deb.sha256"
          done
          for arch in x86_64 aarch64; do
            test -s "dist/fasttab-${VERSION}-1.${arch}.rpm"
            test -s "dist/fasttab-${VERSION}-1.${arch}.rpm.sha256"
          done

      - name: 写入中文发布说明
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          FastTab 2.0.7 修复窗口预览偶发透明问题，同时保留通用实时预览机制和工作区布局修正。

          主要更新：

          - X11 客户端提供有效 RGB 但 pixmap Alpha 为 0 或未定义时，仍按不透明窗口预览处理。
          - 修正位于所有应用共用的降采样着色器中，不按应用名称添加专用判断。
          - 按工作区栏的实际测量宽度调整切换器尺寸，确保最后一个工作区完整显示。
          - 当前只有一个窗口时保持卡片居中，不受工作区栏宽度影响。
          - 移除 Edge、Remmina 和 root framebuffer 等按应用区分的捕获规则。
          - FastTab 隐藏时释放 XComposite/GLX 绑定，再次显示时重新获取最新的 backing pixmap。
          - Firefox、Chrome/Chromium、Edge、视频、Remmina 及其他 X11 客户端统一使用同一套动态预览路径。
          - 缓存截图仅用于跨工作区或窗口暂时未映射时的兜底。
          - 继续提供 x86_64 与 ARM64/AArch64 的 AppImage、DEB 和 RPM 安装包。

          FastTab 需要 Linux、X11 和支持硬件加速的 OpenGL。
          NOTES

      - name: 发布新的正式版本
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: FastTab ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          overwrite_files: true
          draft: false
          prerelease: false
          make_latest: true

      - name: 更新当前正式版本中文说明
        if: steps.version.outputs.publish != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release edit "$VERSION" \
            --title "FastTab $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: 核对当前正式版本
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" > release.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          assert release["tag_name"] == version
          assert release["draft"] is False
          assert release["prerelease"] is False
          assert "主要更新" in release["body"]

          expected = {
              f"FastTab-{version}-x86_64.AppImage",
              f"FastTab-{version}-x86_64.AppImage.sha256",
              f"FastTab-{version}-x86_64.AppImage.zsync",
              f"FastTab-{version}-aarch64.AppImage",
              f"FastTab-{version}-aarch64.AppImage.sha256",
              f"FastTab-{version}-aarch64.AppImage.zsync",
              f"fasttab_{version}_amd64.deb",
              f"fasttab_{version}_amd64.deb.sha256",
              f"fasttab_{version}_arm64.deb",
              f"fasttab_{version}_arm64.deb.sha256",
              f"fasttab-{version}-1.x86_64.rpm",
              f"fasttab-{version}-1.x86_64.rpm.sha256",
              f"fasttab-{version}-1.aarch64.rpm",
              f"fasttab-{version}-1.aarch64.rpm.sha256",
          }

          assets = {asset["name"]: asset for asset in release["assets"]}
          missing = expected - assets.keys()
          assert not missing, f"缺少发布文件: {sorted(missing)}"
          assert all(assets[name]["size"] > 0 for name in expected)
          assert "fasttab-x86_64" not in assets
          PY

      - name: 删除旧的 Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mapfile -t release_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name != \"${VERSION}\") | .id"
          )

          for release_id in "${release_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done

      - name: 删除已移除工作流的历史运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t run_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&status=completed" \
              --jq '.workflow_runs[] | select(.path != ".github/workflows/ci.yml") | .id'
          )

          for run_id in "${run_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          done
